name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25.x", "1.26.x"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
      - name: Verify format, contract, tests, and build
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          make coverage
          go build ./...
          make check-generated
